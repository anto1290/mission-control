<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Control - Isometric Office</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0b0e0c 0%, #151916 100%);
            min-height: 100vh;
            color: #e5e1d8;
            overflow: hidden;
        }
        
        .container { display: flex; height: 100vh; }
        
        /* Sidebar */
        .sidebar {
            width: 260px;
            background: rgba(26, 33, 28, 0.95);
            border-right: 1px solid #2a332d;
            padding: 20px;
            overflow-y: auto;
        }
        
        .logo {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #e5e1d8;
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
            text-decoration: none;
            color: inherit;
            font-size: 14px;
        }
        
        .nav-item:hover { background: rgba(255, 255, 255, 0.05); }
        .nav-item.active { background: rgba(79, 185, 134, 0.15); color: #4fb986; }
        
        .nav-icon { width: 18px; height: 18px; opacity: 0.8; }
        
        /* Main content */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        .header {
            padding: 16px 24px;
            border-bottom: 1px solid #2a332d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 { font-size: 22px; font-weight: 600; }
        
        .controls {
            position: absolute;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        
        .btn {
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid #2a332d;
            background: rgba(26, 33, 28, 0.9);
            color: #e5e1d8;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        
        .btn:hover { background: rgba(79, 185, 134, 0.2); border-color: #4fb986; }
        
        .canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        
        canvas {
            display: block;
            cursor: grab;
        }
        
        canvas:active { cursor: grabbing; }
        
        /* Info panel */
        .info-panel {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background: rgba(26, 33, 28, 0.9);
            border: 1px solid #2a332d;
            border-radius: 10px;
            padding: 14px;
            min-width: 200px;
        }
        
        .info-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #4fb986;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 3px 0;
        }
        
        .info-label { color: #9ca3af; }
        .info-value { color: #e5e1d8; }
        
        /* Tooltip */
        .tooltip {
            position: absolute;
            background: rgba(26, 33, 28, 0.95);
            border: 1px solid #3d4f45;
            border-radius: 8px;
            padding: 12px;
            min-width: 180px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 100;
        }
        
        .tooltip.visible { opacity: 1; }
        
        .tooltip-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }
        
        .tooltip-model {
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 6px;
        }
        
        .tooltip-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        
        /* Room labels */
        .room-label {
            position: absolute;
            background: rgba(26, 33, 28, 0.7);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            color: #9ca3af;
            pointer-events: none;
            border: 1px solid #2a332d;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">Mission Control</div>
            <nav>
                <a href="/" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/>
                    </svg>
                    Dashboard
                </a>
                <a href="/agents" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z"/>
                    </svg>
                    Agents
                </a>
                <a href="/board" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/>
                    </svg>
                    Task Board
                </a>
                <a href="/calendar" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"/>
                    </svg>
                    Calendar
                </a>
                <a href="/activity" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M12.395 2.553a1 1 0 00-1.45-.385c-.345.23-.614.558-.822.88-.214.33-.403.713-.57 1.116-.334.804-.614 1.768-.84 2.734a31.365 31.365 0 00-.613 3.58 2.64 2.64 0 01-.945-1.067c-.328-.68-.398-1.45-.412-1.725a1 1 0 00-1.457-.891c-.507.315-.887.82-1.072 1.416-.22.702-.217 1.568-.011 2.368.216.825.684 1.57 1.28 2.128.615.574 1.416.937 2.287 1.063.185.029.368.07.545.124.593.17 1.13.5 1.555.96.45.492.71 1.12.765 1.787.04.49-.024.99-.19 1.45a4.982 4.982 0 01-1.19 1.93 5.002 5.002 0 01-4.378 1.252c-1.38-.2-2.647-.92-3.55-1.97C1.26 13.196.75 11.776.75 10.25c0-1.526.51-2.946 1.368-4.068.903-1.05 2.17-1.77 3.55-1.97a4.982 4.982 0 012.22.28z" clip-rule="evenodd"/>
                    </svg>
                    Activity
                </a>
                <a href="/office" class="nav-item active">
                    <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h8a2 2 0 012 2v12a1 1 0 110 2h-3a1 1 0 01-1-1v-2a1 1 0 00-1-1H9a1 1 0 00-1 1v2a1 1 0 01-1 1H4a1 1 0 110-2V4zm3 2h2a1 1 0 100-2H7a1 1 0 100 2zm0 3h2a1 1 0 110 2H7a1 1 0 110-2zm0 3h2a1 1 0 110 2H7a1 1 0 110-2z" clip-rule="evenodd"/>
                    </svg>
                    3D Office
                </a>
            </nav>
        </aside>
        
        <!-- Main content -->
        <main class="main">
            <header class="header">
                <h1>Isometric Office</h1>
                <div class="controls">
                    <button class="btn" onclick="resetView()">Reset</button>
                    <button class="btn" onclick="toggleRotate()" id="rotateBtn">Auto Rotate</button>
                </div>
            </header>
            
            <div class="canvas-container">
                <canvas id="officeCanvas"></canvas>
                
                <div class="info-panel" id="infoPanel">
                    <div class="info-title">Office Status</div>
                    <div class="info-row">
                        <span class="info-label">Rooms:</span>
                        <span class="info-value">6</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Stations:</span>
                        <span class="info-value" id="stationCount">9</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Active:</span>
                        <span class="info-value" id="activeCount">1</span>
                    </div>
                </div>
                
                <div class="tooltip" id="tooltip"></div>
            </div>
        </main>
    </div>
    
    <script>
        const canvas = document.getElementById('officeCanvas');
        const ctx = canvas.getContext('2d');
        const tooltip = document.getElementById('tooltip');
        
        let width, height;
        let rotation = -45;
        let zoom = 0.7;
        let offsetX = 0, offsetY = 0;
        let isDragging = false;
        let lastMouse = { x: 0, y: 0 };
        let autoRotate = false;
        let hoveredStation = null;
        
        // Station data - mapped to rooms
        const stations = [
            { id: 'default', name: 'Default', model: 'claude-opus-4.6', gateway: 'Running', room: 'workspace', seat: 1, color: '#5b9bd5' },
            { id: 'backend_enginer', name: 'Backend', model: 'claude-haiku-4-5', gateway: 'Stopped', room: 'workspace', seat: 2, color: '#e07b39' },
            { id: 'business_analyst', name: 'Analyst', model: 'gpt-5-3', gateway: 'Stopped', room: 'meeting', seat: 3, color: '#9f7aea' },
            { id: 'devsecops_enginer', name: 'DevSecOps', model: 'FreeCombo', gateway: 'Stopped', room: 'workspace', seat: 4, color: '#f59e42' },
            { id: 'frontend_enginer', name: 'Frontend', model: 'claude-haiku-4-5', gateway: 'Stopped', room: 'workspace', seat: 5, color: '#4fb986' },
            { id: 'leadenginer', name: 'Lead Eng', model: 'FreeCombo', gateway: 'Running', room: 'workspace', seat: 6, color: '#f472b6' },
            { id: 'project_manager', name: 'PM', model: 'adacode-2.0-pro', gateway: 'Stopped', room: 'meeting', seat: 7, color: '#60a5fa' },
            { id: 'qa_automation', name: 'QA', model: 'FreeCombo', gateway: 'Stopped', room: 'lounge', seat: 8, color: '#a78bfa' },
            { id: 'system_analyst', name: 'Sys Analyst', model: 'gpt-5-3', gateway: 'Stopped', room: 'classroom', seat: 9, color: '#34d399' },
            { id: 'ui_ux_designer', name: 'UI/UX', model: 'FreeCombo', gateway: 'Stopped', room: 'lounge', seat: 10, color: '#5b9bd5' }
        ];
        
        // Room positions (x, y in world space)
        const rooms = {
            workspace: { x: -120, y: -100, w: 140, h: 90, color: '#A0896C', label: 'Open Workspace' },
            reception: { x: -130, y: -5, w: 90, h: 70, color: '#E8E8E8', label: 'Reception' },
            kitchen: { x: 20, y: -100, w: 80, h: 80, color: '#C4B8A0', label: 'Kitchen' },
            lounge: { x: 110, y: -80, w: 80, h: 60, color: '#D4C4A8', label: 'Lounge' },
            classroom: { x: -130, y: 70, w: 100, h: 60, color: '#B8A890', label: 'Classroom' },
            meeting: { x: 20, y: 20, w: 100, h: 60, color: '#A09080', label: 'Meeting' }
        };
        
        function resize() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            width = canvas.width;
            height = canvas.height;
            draw();
        }
        
        window.addEventListener('resize', resize);
        
        // Isometric projection
        function isoProject(x, y, z = 0) {
            const rad = (rotation * Math.PI) / 180;
            const cos = Math.cos(rad);
            const sin = Math.sin(rad);
            
            const isoX = (x - y) * 0.866;
            const isoY = (x + y) * 0.5 - z;
            
            const rotX = isoX * cos - isoY * sin;
            const rotY = isoX * sin + isoY * cos;
            
            return {
                x: rotX * zoom + width / 2 + offsetX,
                y: rotY * zoom + height / 2 + offsetY
            };
        }
        
        function drawBox(x, y, z, w, d, h, topColor, leftColor, rightColor) {
            const p = {
                bl: isoProject(x, y, z),
                br: isoProject(x + w, y, z),
                fl: isoProject(x, y + d, z),
                fr: isoProject(x + w, y + d, z),
                tbl: isoProject(x, y, z + h),
                tbr: isoProject(x + w, y, z + h),
                tfbl: isoProject(x, y + d, z + h),
                tfr: isoProject(x + w, y + d, z + h)
            };
            
            // Right face
            ctx.fillStyle = rightColor;
            ctx.beginPath();
            ctx.moveTo(p.bl.x, p.bl.y);
            ctx.lineTo(p.br.x, p.br.y);
            ctx.lineTo(p.tbr.x, p.tbr.y);
            ctx.lineTo(p.tbl.x, p.tbl.y);
            ctx.closePath();
            ctx.fill();
            
            // Left face
            ctx.fillStyle = leftColor;
            ctx.beginPath();
            ctx.moveTo(p.bl.x, p.bl.y);
            ctx.lineTo(p.fl.x, p.fl.y);
            ctx.lineTo(p.tfbl.x, p.tfbl.y);
            ctx.lineTo(p.tbl.x, p.tbl.y);
            ctx.closePath();
            ctx.fill();
            
            // Top face
            ctx.fillStyle = topColor;
            ctx.beginPath();
            ctx.moveTo(p.tbl.x, p.tbl.y);
            ctx.lineTo(p.tbr.x, p.tbr.y);
            ctx.lineTo(p.tfr.x, p.tfr.y);
            ctx.lineTo(p.tfbl.x, p.tfbl.y);
            ctx.closePath();
            ctx.fill();
            
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 0.5;
            ctx.stroke();
        }
        
        function drawFloor(x, y, w, d, color) {
            const p = [
                isoProject(x, y),
                isoProject(x + w, y),
                isoProject(x + w, y + d),
                isoProject(x, y + d)
            ];
            
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(p[0].x, p[0].y);
            ctx.lineTo(p[1].x, p[1].y);
            ctx.lineTo(p[2].x, p[2].y);
            ctx.lineTo(p[3].x, p[3].y);
            ctx.closePath();
            ctx.fill();
            
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }
        
        function drawDesk(x, y, z, color = '#8B7355') {
            drawBox(x, y, z, 35, 22, 14, 
                shadeColor(color, 15), 
                shadeColor(color, -15), 
                shadeColor(color, -30));
            
            // Monitor
            drawBox(x + 8, y + 4, z + 14, 18, 2, 16,
                '#1a202c', '#0f172a', '#0f172a');
            
            // Screen glow
            const sp = isoProject(x + 17, y + 5, z + 22);
            ctx.fillStyle = 'rgba(91, 155, 213, 0.5)';
            ctx.fillRect(sp.x - 9, sp.y - 7, 18, 14);
        }
        
        function drawChair(x, y, z, color = '#4a5568') {
            drawBox(x, y, z, 11, 11, 11, 
                shadeColor(color, 10),
                shadeColor(color, -10),
                shadeColor(color, -20));
        }
        
        function drawPlant(x, y, z) {
            drawBox(x - 5, y - 5, z, 10, 10, 11,
                '#6b5230', '#4a3720', '#3d2f1c');
            
            const leafColors = ['#4f9c7a', '#3d7a5f', '#5aaa8a'];
            for (let i = 0; i < 3; i++) {
                const pos = isoProject(x + (i - 1) * 6, y, z + 11);
                ctx.fillStyle = leafColors[i];
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 9, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function drawSofa(x, y, z, color = '#e2e8f0') {
            drawBox(x, y, z, 45, 18, 14,
                color,
                shadeColor(color, -15),
                shadeColor(color, -30));
        }
        
        function drawTable(x, y, z, w = 35, d = 35) {
            drawBox(x, y, z, w, d, 5,
                '#8B7355', '#6B5345', '#5B4335');
            
            [[0, 0], [w, 0], [0, d], [w, d]].forEach(([lx, ly]) => {
                drawBox(x + lx - 2, y + ly - 2, z - 22, 4, 4, 22,
                    '#5a4a3a', '#4a3a2a', '#3a2a1a');
            });
        }
        
        function drawReceptionDesk(x, y, z) {
            drawBox(x, y, z, 55, 18, 28,
                '#c4a77d', '#a08050', '#806040');
            
            // Computer
            drawBox(x + 18, y + 4, z + 28, 11, 2, 9,
                '#1a202c', '#0f172a', '#0f172a');
        }
        
        function shadeColor(color, percent) {
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.max(0, Math.min(255, (num >> 16) + amt));
            const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
            const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
            return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }
        
        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            // Background
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#0b0e0c');
            grad.addColorStop(1, '#151916');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
            
            ctx.save();
            ctx.translate(width / 2 + offsetX, height / 2 + offsetY);
            ctx.scale(zoom, zoom);
            ctx.rotate((rotation * Math.PI) / 180);
            
            // Draw floors
            drawFloor(-150, -120, 300, 220, '#8B7355');
            drawFloor(rooms.workspace.x, rooms.workspace.y, rooms.workspace.w, rooms.workspace.h, rooms.workspace.color);
            drawFloor(rooms.reception.x, rooms.reception.y, rooms.reception.w, rooms.reception.h, rooms.reception.color);
            drawFloor(rooms.kitchen.x, rooms.kitchen.y, rooms.kitchen.w, rooms.kitchen.h, rooms.kitchen.color);
            drawFloor(rooms.lounge.x, rooms.lounge.y, rooms.lounge.w, rooms.lounge.h, rooms.lounge.color);
            drawFloor(rooms.classroom.x, rooms.classroom.y, rooms.classroom.w, rooms.classroom.h, rooms.classroom.color);
            drawFloor(rooms.meeting.x, rooms.meeting.y, rooms.meeting.w, rooms.meeting.h, rooms.meeting.color);
            
            // Walls
            drawWall(-150, -120, 300, 2, 80, '#E8DCC4');
            drawWall(-150, -120, 2, 200, 80, '#E8DCC4');
            drawWall(rooms.workspace.x + rooms.workspace.w, rooms.workspace.y, 2, rooms.workspace.h, 50, '#D4C4A8');
            drawWall(rooms.reception.x, rooms.reception.y + rooms.reception.h, rooms.reception.w, 2, 50, '#D4C4A8');
            
            // Reception
            drawReceptionDesk(rooms.reception.x + 15, rooms.reception.y + 10, 0);
            
            // Workspace desks
            drawDesk(rooms.workspace.x + 15, rooms.workspace.y + 15, 0);
            drawDesk(rooms.workspace.x + 60, rooms.workspace.y + 15, 0);
            drawDesk(rooms.workspace.x + 105, rooms.workspace.y + 15, 0);
            drawDesk(rooms.workspace.x + 15, rooms.workspace.y + 50, 0);
            drawDesk(rooms.workspace.x + 60, rooms.workspace.y + 50, 0);
            drawDesk(rooms.workspace.x + 105, rooms.workspace.y + 50, 0);
            
            // Workspace chairs
            drawChair(rooms.workspace.x + 15, rooms.workspace.y + 40, 0);
            drawChair(rooms.workspace.x + 60, rooms.workspace.y + 40, 0);
            drawChair(rooms.workspace.x + 105, rooms.workspace.y + 40, 0);
            drawChair(rooms.workspace.x + 15, rooms.workspace.y + 75, 0);
            drawChair(rooms.workspace.x + 60, rooms.workspace.y + 75, 0);
            drawChair(rooms.workspace.x + 105, rooms.workspace.y + 75, 0);
            
            // Plants in workspace
            drawPlant(rooms.workspace.x + 5, rooms.workspace.y + 5, 0);
            drawPlant(rooms.workspace.x + 130, rooms.workspace.y + 5, 0);
            
            // Kitchen
            drawTable(rooms.kitchen.x + 20, rooms.kitchen.y + 15, 0);
            drawTable(rooms.kitchen.x + 20, rooms.kitchen.y + 50, 0);
            
            // Lounge
            drawSofa(rooms.lounge.x + 10, rooms.lounge.y + 10, 0);
            drawTable(rooms.lounge.x + 35, rooms.lounge.y + 40, 0);
            
            // Classroom
            for (let i = 0; i < 3; i++) {
                drawTable(rooms.classroom.x + 15 + i * 28, rooms.classroom.y + 15, 0, 22, 35);
            }
            
            // Meeting
            drawTable(rooms.meeting.x + 25, rooms.meeting.y + 15, 0, 50, 40);
            
            // Additional plants
            drawPlant(rooms.reception.x + 5, rooms.reception.y + 5, 0);
            drawPlant(rooms.kitchen.x + 70, rooms.kitchen.y + 5, 0);
            drawPlant(rooms.lounge.x + 70, rooms.lounge.y + 5, 0);
            drawPlant(rooms.classroom.x + 5, rooms.classroom.y + 50, 0);
            drawPlant(rooms.meeting.x + 85, rooms.meeting.y + 50, 0);
            
            // Draw walls for room dividers
            drawWall(rooms.workspace.x, rooms.workspace.y + rooms.workspace.h, 2, 20, 40, '#D4C4A8');
            drawWall(rooms.reception.x + rooms.reception.w, rooms.reception.y, 2, rooms.reception.h, 40, '#D4C4A8');
            
            // Room labels
            Object.entries(rooms).forEach(([name, room]) => {
                const center = isoProject(room.x + room.w / 2, room.y + room.h / 2, 0);
                ctx.fillStyle = 'rgba(156, 163, 175, 0.6)';
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(room.label, center.x, center.y - 200);
            });
            
            ctx.restore();
            
            // Draw stations
            stations.forEach((station, index) => {
                const room = rooms[station.room];
                if (!room) return;
                
                // Position within room
                const positions = {
                    'workspace': [
                        { x: room.x + 30, y: room.y + 30 },
                        { x: room.x + 75, y: room.y + 30 },
                        { x: room.x + 120, y: room.y + 30 },
                        { x: room.x + 30, y: room.y + 65 },
                        { x: room.x + 75, y: room.y + 65 },
                        { x: room.x + 120, y: room.y + 65 }
                    ],
                    'meeting': [
                        { x: room.x + 30, y: room.y + 30 },
                        { x: room.x + 70, y: room.y + 30 }
                    ],
                    'lounge': [
                        { x: room.x + 20, y: room.y + 35 }
                    ],
                    'classroom': [
                        { x: room.x + 50, y: room.y + 35 }
                    ],
                    'reception': [
                        { x: room.x + 45, y: room.y + 40 }
                    ],
                    'kitchen': [
                        { x: room.x + 40, y: room.y + 40 }
                    ]
                };
                
                const pos = positions[station.room]?.[index] || { x: room.x + 40, y: room.y + 30 };
                const canvasPos = isoProject(pos.x, pos.y, 0);
                
                drawAgent(station, canvasPos.x, canvasPos.y);
            });
        }
        
        function drawWall(x, y, w, d, h, color) {
            drawBox(x, y, 0, w, d, h, color, shadeColor(color, -30), shadeColor(color, -50));
        }
        
        function drawAgent(station, cx, cy) {
            // Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 5, 10, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Body
            const isActive = station.gateway === 'Running';
            ctx.fillStyle = isActive ? station.color : '#4a5568';
            ctx.beginPath();
            ctx.roundRect(cx - 8, cy - 22, 16, 26, 3);
            ctx.fill();
            
            // Head
            ctx.fillStyle = '#FFDAB9';
            ctx.beginPath();
            ctx.arc(cx, cy - 30, 8, 0, Math.PI * 2);
            ctx.fill();
            
            // Status dot
            const statusColor = isActive ? '#4fb986' : '#5c655d';
            ctx.fillStyle = statusColor;
            ctx.beginPath();
            ctx.arc(cx + 8, cy - 35, 4, 0, Math.PI * 2);
            ctx.fill();
            
            // Pulse for active
            if (isActive) {
                ctx.strokeStyle = 'rgba(79, 185, 134, 0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(cx + 8, cy - 35, 8, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            // Name
            ctx.fillStyle = '#e5e1d8';
            ctx.font = '9px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(station.name, cx, cy + 38);
            
            // Hover
            if (hoveredStation === station) {
                ctx.strokeStyle = '#4fb986';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(cx, cy - 15, 22, 0, Math.PI * 2);
                ctx.stroke();
            }
        }
        
        // Mouse handlers
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouse = { x: e.clientX, y: e.clientY };
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                offsetX += e.clientX - lastMouse.x;
                offsetY += e.clientY - lastMouse.y;
                lastMouse = { x: e.clientX, y: e.clientY };
                draw();
            }
            checkHover(e);
        });
        
        canvas.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('mouseleave', () => isDragging = false);
        
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            zoom = Math.max(0.3, Math.min(3, zoom * (e.deltaY > 0 ? 0.9 : 1.1)));
            draw();
        });
        
        canvas.addEventListener('click', (e) => {
            if (hoveredStation) {
                showTooltip(hoveredStation, e.clientX, e.clientY);
            } else {
                tooltip.classList.remove('visible');
            }
        });
        
        function checkHover(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            let found = null;
            stations.forEach(station => {
                const room = rooms[station.room];
                if (!room) return;
                
                const positions = {
                    'workspace': [{ x: room.x + 30, y: room.y + 30 }, { x: room.x + 75, y: room.y + 30 }, { x: room.x + 120, y: room.y + 30 }, { x: room.x + 30, y: room.y + 65 }, { x: room.x + 75, y: room.y + 65 }, { x: room.x + 120, y: room.y + 65 }],
                    'meeting': [{ x: room.x + 30, y: room.y + 30 }, { x: room.x + 70, y: room.y + 30 }],
                    'lounge': [{ x: room.x + 20, y: room.y + 35 }],
                    'classroom': [{ x: room.x + 50, y: room.y + 35 }],
                    'reception': [{ x: room.x + 45, y: room.y + 40 }],
                    'kitchen': [{ x: room.x + 40, y: room.y + 40 }]
                };
                
                const idx = stations.indexOf(station);
                const pos = positions[station.room]?.[idx] || { x: room.x + 40, y: room.y + 30 };
                const cp = isoProject(pos.x, pos.y, 0);
                
                const dx = x - cp.x;
                const dy = y - cp.y;
                
                if (Math.abs(dx) < 20 && Math.abs(dy) < 30) {
                    found = station;
                }
            });
            
            if (found !== hoveredStation) {
                hoveredStation = found;
                canvas.style.cursor = found ? 'pointer' : 'grab';
                draw();
            }
        }
        
        function showTooltip(station, x, y) {
            tooltip.innerHTML = `
                <div class="tooltip-name">${station.name}</div>
                <div class="tooltip-model">${station.model}</div>
                <div class="tooltip-status">
                    <span class="status-dot" style="background: ${station.gateway === 'Running' ? '#4fb986' : '#5c655d'}"></span>
                    <span>${station.gateway === 'Running' ? 'Active' : 'Idle'}</span>
                    <span style="margin-left: auto; color: #6b7280;">${station.room}</span>
                </div>
            `;
            tooltip.style.left = (x + 15) + 'px';
            tooltip.style.top = (y - 10) + 'px';
            tooltip.classList.add('visible');
        }
        
        function resetView() {
            rotation = -45;
            zoom = 0.7;
            offsetX = 0;
            offsetY = 0;
            draw();
        }
        
        function toggleRotate() {
            autoRotate = !autoRotate;
            document.getElementById('rotateBtn').textContent = autoRotate ? 'Stop Rotate' : 'Auto Rotate';
            if (autoRotate) animate();
        }
        
        function animate() {
            if (!autoRotate) return;
            rotation += 0.2;
            draw();
            requestAnimationFrame(animate);
        }
        
        resize();
    </script>
</body>
</html>
